name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK components
        run: |
          sdkmanager_path=""
          for candidate in "${ANDROID_SDK_ROOT:-}" "${ANDROID_HOME:-}" "${ANDROID_SDK_ROOT:-}/opt/android-sdk" ; do
            if [ -n "$candidate" ]; then
              for tool in "$candidate"/cmdline-tools/*/bin/sdkmanager; do
                if [ -x "$tool" ]; then sdkmanager_path="$tool"; break; fi
              done
            fi
            if [ -n "$sdkmanager_path" ]; then break; fi
          done
          if [ -z "$sdkmanager_path" ]; then echo "sdkmanager not found"; exit 1; fi
          echo "Using $sdkmanager_path"
          yes | "$sdkmanager_path" --licenses > /dev/null 2>&1 || true
          "$sdkmanager_path" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.9 --no-daemon
      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: primalspace-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          tag_name: v1.0.0-${{ github.run_number }}
          name: PrimalSpace ${{ github.run_number }}
          body: Native Android worker for PrimalSpace. Enable compute opt-in in the app and keep the foreground service running to accept work.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
